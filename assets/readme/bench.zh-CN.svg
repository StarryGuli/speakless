<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 546" width="1200" height="546" role="img" aria-labelledby="t d"><title id="t">Benchmark vs Typeless</title><desc id="d">Bar chart of cleanup-stage character error rate versus Typeless output for several speech recognition models.</desc><rect x="1" y="1" width="1198" height="544" rx="28" fill="#F3F1EC" stroke="#D9D6CE" stroke-width="2"/><text x="56" y="70" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Helvetica Neue', sans-serif" font-size="36" font-weight="700" fill="#161618" text-anchor="start" letter-spacing="0" >和 Typeless 输出的接近程度</text><text x="56" y="104" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Helvetica Neue', sans-serif" font-size="20" font-weight="500" fill="#6E6D72" text-anchor="start" letter-spacing="0" >越低越接近 · 60 条真实录音 · 整理后</text><text x="384" y="167" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Helvetica Neue', sans-serif" font-size="20" font-weight="500" fill="#161618" text-anchor="end" letter-spacing="0" >mai-transcribe-1.5</text><rect x="400" y="140" width="325" height="36" rx="8" fill="#CFCBC0"/><text x="736.9599999999999" y="167" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Helvetica Neue', sans-serif" font-size="20" font-weight="700" fill="#161618" text-anchor="start" letter-spacing="0" >20.3%</text><text x="384" y="217" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Helvetica Neue', sans-serif" font-size="20" font-weight="500" fill="#161618" text-anchor="end" letter-spacing="0" >transcribe-1</text><rect x="400" y="190" width="338" height="36" rx="8" fill="#CFCBC0"/><text x="749.5999999999999" y="217" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Helvetica Neue', sans-serif" font-size="20" font-weight="700" fill="#161618" text-anchor="start" letter-spacing="0" >21.1%</text><text x="384" y="267" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Helvetica Neue', sans-serif" font-size="20" font-weight="500" fill="#161618" text-anchor="end" letter-spacing="0" >mai-transcribe-2</text><rect x="400" y="240" width="345" height="36" rx="8" fill="#CFCBC0"/><text x="756.64" y="267" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Helvetica Neue', sans-serif" font-size="20" font-weight="700" fill="#161618" text-anchor="start" letter-spacing="0" >21.5%</text><text x="384" y="317" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Helvetica Neue', sans-serif" font-size="20" font-weight="700" fill="#161618" text-anchor="end" letter-spacing="0" >Qwen3-ASR-1.7B</text><rect x="400" y="290" width="364" height="36" rx="8" fill="#3B5BF5"/><text x="775.8399999999999" y="317" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Helvetica Neue', sans-serif" font-size="20" font-weight="700" fill="#161618" text-anchor="start" letter-spacing="0" >22.7%</text><text x="843.8399999999999" y="317" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Helvetica Neue', sans-serif" font-size="18" font-weight="600" fill="#3B5BF5" text-anchor="start" letter-spacing="0" >当前默认</text><text x="384" y="367" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Helvetica Neue', sans-serif" font-size="20" font-weight="500" fill="#161618" text-anchor="end" letter-spacing="0" >qwen3-asr-0.6b</text><rect x="400" y="340" width="364" height="36" rx="8" fill="#CFCBC0"/><text x="776.0" y="367" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Helvetica Neue', sans-serif" font-size="20" font-weight="700" fill="#161618" text-anchor="start" letter-spacing="0" >22.8%</text><text x="384" y="417" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Helvetica Neue', sans-serif" font-size="20" font-weight="500" fill="#161618" text-anchor="end" letter-spacing="0" >scribe-v2</text><rect x="400" y="390" width="378" height="36" rx="8" fill="#CFCBC0"/><text x="789.76" y="417" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Helvetica Neue', sans-serif" font-size="20" font-weight="700" fill="#161618" text-anchor="start" letter-spacing="0" >23.6%</text><text x="384" y="467" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Helvetica Neue', sans-serif" font-size="20" font-weight="500" fill="#161618" text-anchor="end" letter-spacing="0" >voxtral-mini-transcribe</text><rect x="400" y="440" width="379" height="36" rx="8" fill="#CFCBC0"/><text x="790.88" y="467" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Helvetica Neue', sans-serif" font-size="20" font-weight="700" fill="#161618" text-anchor="start" letter-spacing="0" >23.7%</text><text x="56" y="514" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Helvetica Neue', sans-serif" font-size="18" font-weight="500" fill="#6E6D72" text-anchor="start" letter-spacing="0" >参照 = Typeless 自己的整理结果；差距小于约 2 个点可视为噪声。</text></svg>