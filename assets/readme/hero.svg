<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400" role="img" aria-labelledby="t d"><title id="t">Speakless</title><desc id="d">Native macOS dictation: press a key, speak, cleaned-up text lands at the cursor.</desc><rect x="1" y="1" width="1198" height="398" rx="28" fill="#F3F1EC" stroke="#D9D6CE" stroke-width="2"/><text x="64" y="78" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="20" font-weight="600" fill="#3B5BF5" text-anchor="start" letter-spacing="1.5" >macOS DICTATION  ·  BRING YOUR OWN MODEL</text><text x="60" y="214" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Helvetica Neue', sans-serif" font-size="132" font-weight="700" fill="#161618" text-anchor="start" letter-spacing="-4" >Speakless</text><text x="64" y="272" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Helvetica Neue', sans-serif" font-size="34" font-weight="600" fill="#161618" text-anchor="start" letter-spacing="0" >Press a key, speak.</text><text x="64" y="316" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Helvetica Neue', sans-serif" font-size="34" font-weight="600" fill="#161618" text-anchor="start" letter-spacing="0" >Clean text lands at your cursor.</text><rect x="64" y="340" width="214" height="38" rx="19" fill="none" stroke="#161618" stroke-width="2"/><text x="171.0" y="366" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Helvetica Neue', sans-serif" font-size="20" font-weight="600" fill="#161618" text-anchor="middle" letter-spacing="0" >Your own API key</text><rect x="290" y="340" width="178" height="38" rx="19" fill="none" stroke="#161618" stroke-width="2"/><text x="379.0" y="366" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Helvetica Neue', sans-serif" font-size="20" font-weight="600" fill="#161618" text-anchor="middle" letter-spacing="0" >Local models</text><rect x="480" y="340" width="178" height="38" rx="19" fill="none" stroke="#161618" stroke-width="2"/><text x="569.0" y="366" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Helvetica Neue', sans-serif" font-size="20" font-weight="600" fill="#161618" text-anchor="middle" letter-spacing="0" >Ask Anything</text><rect x="700" y="52" width="440" height="304" rx="22" fill="#FFFFFF" stroke="#D9D6CE" stroke-width="2"/><circle cx="730" cy="84" r="6" fill="#FF5F57"/><circle cx="750" cy="84" r="6" fill="#FEBC2E"/><circle cx="770" cy="84" r="6" fill="#28C840"/><rect x="800" y="70" width="300" height="52" rx="26" fill="#161618"/><rect x="826" y="91.0" width="5" height="10" rx="2.5" fill="#FFFFFF"/><rect x="837" y="87.0" width="5" height="18" rx="2.5" fill="#FFFFFF"/><rect x="848" y="82.0" width="5" height="28" rx="2.5" fill="#FFFFFF"/><rect x="859" y="88.0" width="5" height="16" rx="2.5" fill="#FFFFFF"/><rect x="870" y="80.0" width="5" height="32" rx="2.5" fill="#FFFFFF"/><rect x="881" y="85.0" width="5" height="22" rx="2.5" fill="#FFFFFF"/><rect x="892" y="90.0" width="5" height="12" rx="2.5" fill="#FFFFFF"/><rect x="903" y="83.0" width="5" height="26" rx="2.5" fill="#FFFFFF"/><rect x="914" y="87.0" width="5" height="18" rx="2.5" fill="#FFFFFF"/><rect x="925" y="81.0" width="5" height="30" rx="2.5" fill="#FFFFFF"/><rect x="936" y="89.0" width="5" height="14" rx="2.5" fill="#FFFFFF"/><rect x="947" y="85.0" width="5" height="22" rx="2.5" fill="#FFFFFF"/><rect x="958" y="91.0" width="5" height="10" rx="2.5" fill="#FFFFFF"/><text x="990" y="103" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Helvetica Neue', sans-serif" font-size="22" font-weight="600" fill="#FFFFFF" text-anchor="start" letter-spacing="0" >Listening</text><text x="730" y="168" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="600" fill="#6E6D72" text-anchor="start" letter-spacing="1.5" >WHAT YOU SAID</text><text x="730" y="196" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Helvetica Neue', sans-serif" font-size="20" font-weight="400" fill="#6E6D72" text-anchor="start" letter-spacing="0" >um so I think I can't make it on</text><text x="730" y="222" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Helvetica Neue', sans-serif" font-size="20" font-weight="400" fill="#6E6D72" text-anchor="start" letter-spacing="0" >friday can you send me the file</text><path d="M 730 242 L 1110 242" stroke="#D9D6CE" stroke-width="2" stroke-dasharray="4 6"/><text x="730" y="276" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="600" fill="#2E9C74" text-anchor="start" letter-spacing="1.5" >WHAT LANDS</text><text x="730" y="306" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Helvetica Neue', sans-serif" font-size="26" font-weight="700" fill="#161618" text-anchor="start" letter-spacing="0" >I can't make it on Friday.</text><text x="730" y="338" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Helvetica Neue', sans-serif" font-size="26" font-weight="700" fill="#161618" text-anchor="start" letter-spacing="0" >Can you send me the file?</text></svg>